indent:
    tokens:
        use_clause:
            keyword:
                token_after_library_clause: 'current'
                token_if_no_matching_library_clause: 'current'
        component_instantiation_statement:
            instantiation_label:
                after: 'current'
                token: 'current'
            semicolon:
                after: 'current'
                token: 'current'
    options:
        comment:
            align_with_end_of_declarative_part: true
            align_with_end_of_statement_part: true
