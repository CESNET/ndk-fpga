rule:
    global:
        disable: true
        indent_size: 4

    group:
        alignment:
            disable: false
            compact_alignment: 'no'
            comment_line_ends_group: 'no'
        indent:
            disable: false
        naming:
            disable: false
            prefixes: ['']
            suffixes: ['']
        structure:
            disable: false
        whitespace:
            disable: false
        case:
            disable: false
        case::name:
            case_exceptions:
                - 'IEEE'

    entity_003:
        style : allow_comment
    entity_008:
        case: 'upper'
    entity_012:
        disable : true
    # for discussion
    entity_018:
        disable : true
    entity_019:
        action: 'remove'

    generic_007:
