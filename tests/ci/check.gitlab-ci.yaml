variables:
  BASE_COMMIT_SHA: $CI_COMMIT_SHA

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      variables:
        BASE_COMMIT_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        BASE_COMMIT_SHA: $CI_COMMIT_SHA

editorconfig:
  stage: check
  needs: []
  image: mstruebing/editorconfig-checker
  script: [ec]

pycodestyle:
  stage: check
  needs: []
  image:
    name: python:3.11-slim
    entrypoint: [""]
  before_script:
    - source env.sh
    - pip install uv # get a package manager that can just install dependencies
    - uv pip install --system -r python/ofm/pyproject.toml --extra test --extra nfb-pypi
    - mypy python/ofm --config-file=python/ofm/pyproject.toml --install-types --non-interactive
  script:
    - sh tests/ci/pycodestyle.sh

commitlint:
  stage: check
  needs: []
  image: registry.hub.docker.com/library/node:alpine
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - npm install --save-dev @commitlint/config-conventional @commitlint/cli
  script:
    - |
      if [ "${BASE_COMMIT_SHA}" = "${CI_COMMIT_SHA}" ]; then
        echo "BASE_COMMIT_SHA equals CI_COMMIT_SHA, linting last commit only"
        npx commitlint --extends '@commitlint/config-conventional' --last
      else
        npx commitlint --extends '@commitlint/config-conventional' --from "${BASE_COMMIT_SHA}" --to "${CI_COMMIT_SHA}"
      fi

vhdlcodestyle:
    stage: check
    needs: []
    image: python:3.11-slim
    variables:
      VSG_CONFIG_PATH: "tests/ci/vsg_config.yaml"
    before_script:
        - pip install -U vsg==3.35.0
    script:
        # Find all VHDL files in selected folders
        - PATHS=("apps" "core" "comp/axis_tools" "comp/base"  "comp/dma" "comp/mem_tools" "comp/mfb_tools" "comp/mvb_tools" "comp/mi_tools" "comp/nic" "comp/pcie" "comp/tsu")
        - readarray -d '' VHDL_FILES < <(find "${PATHS[@]}" -name "*.vhd" -print0)
        - vsg -of syntastic --all_phases -c "${VSG_CONFIG_PATH}" -f "${VHDL_FILES[@]}"

veriblelint:
  stage: check
  needs: []
  image:
    name: registry.gitlab.com/python-gitlab/python-gitlab:v3.11.0-alpine
    entrypoint: [""]
  before_script:
    - sh tests/verible/install.sh
  script:
    - python3 tests/verible/gitlab_runner.py
