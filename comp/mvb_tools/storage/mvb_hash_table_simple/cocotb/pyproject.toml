[project]
name = "cocotb-hash-table-simple-test"
version = "0.1.0"
dependencies = [
    "cocotb == 1.9.2",
    "cocotbext-ofm[nfb] @ ${NDK_FPGA_COCOTBEXT_OFM_URL}",
    "cython",
    "wheel",
    "setuptools",
    "pylibfdt",
    "fdt",
    "scapy",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
